<html>
<head>
    <title>Select Playlists</title>
    <style>
        body {
            background-color: #191414;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            text-align: center;
            color: #ffffff;
            margin-bottom: 20px;
            font-size: 2.5em; 
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }
        form {
            background-color: #1ed760;
            padding: 30px; 
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
            width: 400px;
            transition: transform 0.3s; 
        }
        form:hover {
            transform: scale(1.02); 
        }
        div {
            margin-bottom: 15px; 
            display: flex;
            align-items: center; 
        }
        input[type="checkbox"] {
            margin-right: 15px;
            accent-color: #191414; 
            transform: scale(1.2); 
        }
        button {
            width: 100%;
            padding: 12px; 
            background-color: #191414;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px; 
            transition: background-color 0.3s; 
        }
        button:hover {
            background-color: #333333;
        }
        p {
            font-size: 1.2em; 
            font-weight: bold;
            margin: 0; 
        }
    </style>
</head>
<body>
    <form method="POST" action="fetch_songs">
        <h1>Select Playlist:</h1>
        {% for playlist in playlists %}
        <div>
            <input type="checkbox" name="playlist_ids" value="{{playlist['id']}}">
            <p>{{playlist['name']}}. No. of Tracks: {{playlist['track_count'] }}</p>
        </div>
        {% endfor %}
        <button type="submit">Fetch Songs</button>
    </form>
</body>
</html>
